name: CI

# The Agate drift guard (web/tests/agate-rules.test.ts) and every unit test only
# guard anything if something runs them. Railway deploys straight off a push to
# main without running tests, so this workflow is what turns "make test passes on
# my machine" into an actual gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — vitest + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20" # matches web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Bare `vitest run` silently picks up NO config and fails on JSX — the
      # explicit --config is required (see CLAUDE.md § Commands).
      - name: Unit tests (includes the Agate drift guard)
        run: npx vitest --config tests/vitest.config.ts run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (existing nonfatal Dashboard ref warning retained)
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Next needs these present at build time; values are irrelevant to a
          # build and are never real secrets.
          AUTH_SECRET: ci-build-not-a-real-secret
          AUTH_BACKEND_SECRET: ci-build-not-a-real-secret

  api:
    name: api — pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-generation-test
          POSTGRES_DB: generation_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GENERATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:local-generation-test@127.0.0.1:5432/generation_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # api/pyproject.toml requires >=3.11
      # The engine installs editable from the repo root; the API installs
      # editable on top, exactly as api/Dockerfile does it.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --frozen --all-packages --all-extras
      # `api/tests` and `tests/` are both packages named "tests", so a single
      # rootdir-wide pytest run collides. They are run separately, from their
      # own directories (see CLAUDE.md § Commands).
      - name: Backend tests
        run: uv run --frozen pytest -q
        working-directory: api
      - name: Engine + CLI tests
        run: uv run --frozen pytest tests -q
      - name: Container runtime contract (no provider network)
        run: |
          docker build -f api/Dockerfile -t generation-contract .
          docker run --rm --network none generation-contract python scripts/check_generation_runtime.py

  recap-media:
    name: recap — isolated Linux render and decode
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-recap-acceptance
          POSTGRES_DB: recap_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f media/Dockerfile --build-arg VCS_REF=${{ github.sha }} -t recap-media-contract .
      - name: Namespace boundary, cancellation and actual media failures
        run: >-
          docker run --rm --network none --memory 2g --tmpfs /scratch:size=4g
          --cap-add SYS_ADMIN --security-opt seccomp=unconfined
          --security-opt apparmor=unconfined --security-opt systempaths=unconfined
          -e BOUNDARY_SECRET=recap-boundary-sentinel -e RECAP_LINUX_TEST=1 -e TMPDIR=/scratch
          recap-media-contract python scripts/check_recap_media_runtime.py
      - name: Default runtime must refuse unsupported isolation before claims
        run: >-
          docker run --rm --network none --memory 2g --tmpfs /scratch:size=4g
          recap-media-contract python scripts/check_recap_media_runtime.py --expect-refusal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --frozen --all-packages --all-extras
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Disposable PostgreSQL, real Linux stages and authenticated phone browser
        working-directory: api
        run: uv run --frozen pytest tests/test_recap_video_end_to_end.py -q --basetemp=/tmp/recap-acceptance
        env:
          RECAP_ACCEPTANCE: "1"
          RECAP_ACCEPTANCE_IMAGE: recap-media-contract
          GENERATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:local-recap-acceptance@127.0.0.1:5432/recap_tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-recap-acceptance
          path: |
            /tmp/recap-acceptance/**/acceptance-evidence.json
            /tmp/recap-acceptance/**/browser/*.png
            /tmp/recap-acceptance/**/browser.log
            /tmp/recap-acceptance/**/next.log
          retention-days: 7
