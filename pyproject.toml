[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-dynasty"
version = "0.1.0"
description = "Sleeper fantasy football dynasty league analyzer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.2",
    "jinja2>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyarrow>=15.0"]

[project.scripts]
sleeper-dynasty = "sleeper_dynasty.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sleeper_dynasty = ["llm/prompts/*.md", "data/*.json.gz"]
